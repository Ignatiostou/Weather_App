<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 68" aria-label="Weather app favicon" role="img">
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff7d6" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffc14d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff9a1f" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e7f0ff"/>
      <stop offset="100%" stop-color="#c3d4ee"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6fb1ff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffa53b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8fd6ff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="24" cy="24" r="12" fill="url(#sun)" filter="url(#glow)"/>
  <g stroke="#ffb347" stroke-width="2.6" stroke-linecap="round" opacity="0.9">
    <line x1="24" y1="6" x2="24" y2="12"/>
    <line x1="24" y1="36" x2="24" y2="42"/>
    <line x1="6" y1="24" x2="12" y2="24"/>
    <line x1="36" y1="24" x2="42" y2="24"/>
    <line x1="10" y1="10" x2="14" y2="14"/>
    <line x1="34" y1="34" x2="38" y2="38"/>
    <line x1="10" y1="38" x2="14" y2="34"/>
    <line x1="34" y1="14" x2="38" y2="10"/>
  </g>

  <path
    d="M18 48c0-6.5 5.3-11.8 11.8-11.8 4.6 0 8.6 2.5 10.7 6.4 0.8-0.3 1.6-0.5 2.6-0.5 4.5 0 8.1 3.6 8.1 8.1S47.6 58.3 43.1 58.3H26.5C21.7 58.3 18 54.3 18 50z"
    fill="url(#cloud)"
    stroke="#b7c8dc"
    stroke-width="2.1"
    stroke-linejoin="round"
  />

  <path
    d="M18 52.8c10 -1.6 15.5 -1.9 25.8 -0.4"
    fill="none"
    stroke="url(#horizon)"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <g fill="none" stroke="#b7c8dc" stroke-width="1.9" stroke-linecap="round">
    <path d="M30 54c-1 2.2-3 3.6-5.5 3.6"/>
    <path d="M38 54c-0.8 1.8-2.4 3-4.4 3"/>
  </g>
</svg>